# =====================================================================
# z-lc-web 集成测试环境: H2 内存库 (MODE=MySQL), 与 z-lc-admin dev profile 同构.
# 两个 DataSource (spring.datasource Hikari + dataSourceLc Druid) 指向同一 mem 实例,
# 由 TestDataInitializer 手动灌 schema/data (spring.sql.init 因双 DataSource 会退避).
# =====================================================================
spring.main.allow-bean-definition-overriding=true

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:zlcweb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER,KEY
spring.datasource.username=sa
spring.datasource.password=

z.base.db.default.jdbc-url=jdbc:h2:mem:zlcweb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER,KEY
z.base.db.default.driver-class-name=org.h2.Driver
z.base.db.default.username=sa
z.base.db.default.password=

z.base.db.lc.jdbc-url=jdbc:h2:mem:zlcweb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER,KEY
z.base.db.lc.driver-class-name=org.h2.Driver
z.base.db.lc.username=sa
z.base.db.lc.password=

spring.sql.init.mode=never
