# ============================================================
# z-lc —— Service（NodePort）
# 线上实况（/tmp/zdeploy-base/z-lc.yaml 导出为准）：
#   Service  z-lc-admin  NodePort  8080 → targetPort http  nodePort 31890
#   selector app.kubernetes.io/name=z-lc-admin
#
# 端口与 NodePort 号**照抄线上**，不重新分配（改号会让既有调用方失联，收益为零）。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: z-lc-admin
  namespace: z-lc
  labels:
    app.kubernetes.io/name: z-lc-admin
    app.kubernetes.io/part-of: z-opc-foundation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: z-lc-admin
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 31890
